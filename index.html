<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lịch Hẹn Mini</title>
    <meta name="description" content="Đặt và quản lý lịch hẹn cá nhân, tự động phát hiện trùng giờ." />
    <meta name="theme-color" content="#f6f4ee" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='3' y='5' width='26' height='24' rx='6' fill='%23ee8a12'/><path d='M3 12h26' stroke='white' stroke-width='2'/><path d='M11 21l3.5 3.5 6.5-6.5' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="wrap topbar-inner">
        <a class="brand" href="./">
          <span class="logo" aria-hidden="true"><span id="logo-day">01</span></span>
          <strong>Lịch Hẹn Mini</strong>
        </a>
        <div class="top-actions">
          <button type="button" class="btn primary cta" id="btn-new" hidden><i data-icon="plus" data-size="16"></i>Tạo lịch hẹn</button>
          <div id="user-chip" class="user-chip" hidden>
            <img id="user-avatar" alt="" referrerpolicy="no-referrer" hidden />
            <span id="user-initial" class="avatar-fallback" aria-hidden="true"></span>
            <span id="user-name"></span>
            <button type="button" class="link-btn" id="btn-logout">Đăng xuất</button>
          </div>
        </div>
      </div>
    </header>

    <main id="login-view" class="wrap login" hidden>
      <section class="login-card">
        <span class="logo lg" aria-hidden="true"><span id="login-day">01</span></span>
        <h1>Lịch Hẹn Mini</h1>
        <p class="muted">Đặt lịch hẹn cá nhân, tự động phát hiện trùng giờ.</p>
        <div id="google-btn" class="google-btn"></div>
        <p id="login-error" class="error" role="alert"></p>
        <div id="login-divider" class="divider"><span>hoặc</span></div>
        <button type="button" class="btn" id="btn-guest">Dùng thử không cần đăng nhập</button>
        <p class="fine">Dữ liệu được lưu trên trình duyệt của bạn.</p>
      </section>
    </main>

    <main id="app-view" class="wrap layout" hidden>
      <aside class="panel cal-card" aria-labelledby="cal-label">
        <div class="cal-head">
          <h2 id="cal-label" class="cal-label"></h2>
          <div class="cal-nav">
            <button type="button" class="icon-btn" id="cal-prev" aria-label="Tháng trước"><i data-icon="chevron-left"></i></button>
            <button type="button" class="icon-btn" id="cal-next" aria-label="Tháng sau"><i data-icon="chevron-right"></i></button>
          </div>
        </div>
        <div class="cal-grid cal-weekdays" aria-hidden="true">
          <span>T2</span><span>T3</span><span>T4</span><span>T5</span><span>T6</span><span>T7</span><span>CN</span>
        </div>
        <div id="cal-days" class="cal-grid cal-days"></div>
        <div id="day-panel" class="day-panel">
          <div class="day-info">
            <strong id="day-title"></strong>
            <small id="day-meta"></small>
          </div>
          <button type="button" class="link-btn accent" id="btn-add-day">+ Thêm lịch</button>
        </div>
      </aside>

      <section class="panel list-card" aria-labelledby="list-heading">
        <h2 id="list-heading" class="sr-only">Lịch hẹn</h2>
        <nav class="tabs" aria-label="Lọc lịch hẹn">
          <button type="button" class="tab" id="btn-all">Tất cả</button>
          <button type="button" class="tab" id="btn-today">Hôm nay</button>
          <button type="button" class="tab" data-filter="upcoming">Sắp tới <span class="n"></span></button>
          <button type="button" class="tab" data-filter="done">Đã xong <span class="n"></span></button>
          <button type="button" class="tab" data-filter="cancelled">Đã hủy <span class="n"></span></button>
        </nav>
        <div id="list-context" class="list-context" hidden>
          <span id="list-sub"></span>
          <button type="button" class="link-btn" id="btn-clear-day">Bỏ chọn ngày</button>
        </div>
        <input id="filter-date" type="hidden" />

        <div id="list" aria-live="polite"></div>
        <button type="button" class="link-btn seed" id="btn-seed">Nạp dữ liệu mẫu để thử</button>
      </section>
    </main>

    <dialog id="appt-dialog" class="modal" aria-labelledby="form-heading">
      <div class="modal-head">
        <div>
          <h2 id="form-heading">Tạo lịch hẹn</h2>
          <p id="form-sub" class="muted"></p>
        </div>
        <button type="button" class="icon-btn" id="btn-close" aria-label="Đóng"><i data-icon="x"></i></button>
      </div>
      <form id="appt-form" novalidate>
        <label class="field">
          <span>Tiêu đề</span>
          <input id="f-title" name="title" type="text" maxlength="120" placeholder="VD: Khám răng định kỳ" autocomplete="off" />
          <small class="error" data-for="title"></small>
        </label>

        <label class="field">
          <span>Ngày</span>
          <input id="f-date" name="date" type="date" />
        </label>

        <div class="row">
          <label class="field">
            <span>Bắt đầu</span>
            <input id="f-start" name="start" type="time" step="300" />
          </label>
          <label class="field">
            <span>Kết thúc</span>
            <input id="f-end" name="end" type="time" step="300" />
          </label>
        </div>
        <small class="error" data-for="start"></small>
        <small class="error" data-for="end"></small>

        <label class="field">
          <span>Ghi chú <em>(không bắt buộc)</em></span>
          <textarea id="f-note" name="note" rows="2" maxlength="520" placeholder="Địa điểm, người liên hệ…"></textarea>
          <small class="hint"><span id="note-count">0</span>/500</small>
          <small class="error" data-for="note"></small>
        </label>

        <div id="conflict-box" class="conflict" role="alert" hidden></div>

        <div class="modal-actions">
          <button type="button" class="btn" id="btn-cancel">Hủy</button>
          <button type="submit" class="btn primary">Lưu lịch hẹn</button>
        </div>
      </form>
    </dialog>

    <dialog id="detail-dialog" class="modal detail" aria-labelledby="detail-title">
      <div class="modal-head">
        <span id="detail-status" class="status"></span>
        <button type="button" class="icon-btn" id="detail-close" aria-label="Đóng"><i data-icon="x"></i></button>
      </div>
      <h2 id="detail-title" class="detail-title" tabindex="-1" autofocus></h2>
      <ul id="detail-rows" class="detail-rows"></ul>
      <div id="detail-error" class="conflict" role="alert" hidden></div>
      <div id="detail-actions" class="detail-actions"></div>
    </dialog>

    <dialog id="confirm-dialog" class="modal confirm" aria-labelledby="confirm-title">
      <h2 id="confirm-title"></h2>
      <p id="confirm-message" class="muted"></p>
      <div class="modal-actions">
        <button type="button" class="btn" id="confirm-cancel">Không</button>
        <button type="button" class="btn danger-fill" id="confirm-ok">Xóa</button>
      </div>
    </dialog>

    <div id="toast" class="toast" role="status" hidden></div>

    <script type="module" src="src/app.js"></script>
  </body>
</html>
